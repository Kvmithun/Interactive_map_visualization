<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Geo Interface Pro</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
      crossorigin=""
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
      crossorigin=""
    />

    <script src="https://unpkg.com/lucide@latest"></script>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>

  <body>

    <div class="app-container">

      <div class="app-header">
        <div class="app-logo">
          <i data-lucide="map" class="icon-logo"></i> Geo Interface Pro
        </div>
        <div class="app-toggle">
          <label class="switch">
            <input type="checkbox" id="basemapToggle" checked>
            <span class="slider round"></span>
          </label>
        </div>
      </div>


      <div class="app-main">

        <div class="sidebar" id="sidebar">
          <div class="panel-section">
            <label for="lat" class="input-label">Latitude</label>
            <input id="lat" type="number" step="any" placeholder="e.g. 40.7128" value="40.7128"/>
          </div>

          <div class="panel-section">
            <label for="lng" class="input-label">Longitude</label>
            <input id="lng" type="number" step="any" placeholder="e.g. -74.0060" value="-74.0060"/>
          </div>

          <div class="panel-section">
            <label for="label" class="input-label">Address</label>
            <input id="label" type="text" placeholder="e.g. New York, NY" value="New York, NY"/>
          </div>


          <div class="panel-section" style="display: none;">
              <label for="color" class="input-label">Marker Color</label>
              <input id="color" type="color" value="#1E88E5" class="color-input-field" />
          </div>

          <div class="button-group">
            <button id="btn-add" class="btn-primary">Add Marker</button>
            <button id="btn-clear-all" class="btn-secondary">Clear All</button>
            <button id="btn-center" class="btn-secondary">Fit to markers</button>
            <button id="btn-presidency" class="btn-secondary">Zoom to Default</button>
          </div>


          <div class="list-section">
            <div class="list-header">Markers List</div>
            <div class="marker-list" id="markerList"></div>
          </div>
        </div>


        <div id="map" class="map-panel">
            <div class="custom-map-controls">
                <div class="layers-control">
                    Layers
                    <label class="switch" style="display:none">
                        <input type="checkbox" id="tempToggle" checked>
                        <span class="slider round"></span>
                    </label>
                    <select id="basemapSelect">
                        <option value="osm">OpenStreetMap</option>
                        <option value="carto">Carto Voyager</option>
                        <option value="sat">Imagery (Esri)</option>
                    </select>
                </div>

                <div class="zoom-controls">
                    <button class="zoom-button" id="zoomInButton">+</button>
                    <button class="zoom-button" id="zoomOutButton">-</button>
                </div>
            </div>
        </div>
      </div>
    </div>


    <div id="clearModal" class="custom-modal">
        <div class="modal-content">
            <h4>Confirm Deletion ⚠️</h4>
            <p>Are you sure you want to delete ALL markers? This action cannot be undone.</p>
            <div class="modal-actions">
                <button id="cancelClear" class="btn-secondary">Cancel</button>
                <button id="confirmClear" class="btn-danger">Delete All</button>
            </div>
        </div>
    </div>


    <div id="toastNotification" class="toast"></div>


    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster-src.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

    <script src="{{ url_for('static', filename='js/map.js') }}"></script>

    <script>
        lucide.createIcons();
    </script>
  </body>
</html>
